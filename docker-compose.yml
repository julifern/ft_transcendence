services:
  nginx:
    container_name: nginx
    build: ./nginx/
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
      - react
    restart: unless-stopped
    networks:
      - transcendence-net

  django:
    container_name: django
    build: ./backend/
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    networks:
      - transcendence-net
    depends_on:
      postgres:
        condition: service_healthy

  react:
    container_name: react
    build: ./frontend/
    expose:
      - "5173"
    restart: on-failure
    networks:
      - transcendence-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-net

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_STORAGE_PATH:-./ai_models}:/root/.ollama
    restart: on-failure
    networks:
      - transcendence-net

  # Service ephemere qui s'assure que le modele est bien telecharge au demarrage
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"
    networks:
      - transcendence-net

volumes:
  ssl_certs:
  postgres_data:

networks:
  transcendence-net:
    driver: bridge